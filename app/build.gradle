plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.z9tether.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.z9tether.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1-testable'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
